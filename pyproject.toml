[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reintel"
version = "1.0.0"
description = "AI real estate investment and property valuation intelligence on HM Land Registry, ONS and OS open data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Zubair" }]
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45",
  "pyproj>=3.6", "openpyxl>=3.1", "streamlit>=1.40", "plotly>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["reintel", "common", "fixtures"]
